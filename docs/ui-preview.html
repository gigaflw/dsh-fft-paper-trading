<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟盘 UI 对比 · A 舒适 / B 紧凑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { --stage-w: 1080px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e4e7ec; color: #1b1f27; padding: 18px 20px 40px;
  }
  body[data-theme="dark"] { background: #0b0d10; color: #eef1f5; }

  .toolbar {
    max-width: 1200px; margin: 0 auto 16px; display: flex; gap: 14px;
    align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .brand small { display: block; font-weight: 400; opacity: .65; margin-top: 2px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .control { display: inline-flex; border: 1px solid rgba(0,0,0,.16); border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.72); }
  body[data-theme="dark"] .control { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
  .control button {
    border: 0; background: none; color: inherit; padding: 5px 10px; font-size: 12px;
    cursor: pointer; font-family: inherit;
  }
  .control button + button { border-left: 1px solid rgba(0,0,0,.10); }
  body[data-theme="dark"] .control button + button { border-left-color: rgba(255,255,255,.12); }
  .control button.on { background: #2d3142; color: #fff; }
  body[data-theme="dark"] .control button.on { background: #ff8352; color: #17181c; }

  main { max-width: 1200px; margin: 0 auto; }
  .variant { display: block; }
  body[data-variant="A"] .variant[data-variant="B"],
  body[data-variant="B"] .variant[data-variant="A"] { display: none; }

  /* ---------- token layer: one set, two densities ---------- */
  .frame {
    --bg-page: #e7eaef;
    --bg-panel: #ffffff;
    --bg-rail: #f3f5f8;
    --bg-subtle: #f7f8fa;
    --bg-hover: #eef1f5;
    --text: #171b22;
    --muted: #49525f;
    --faint: #6b7480;
    --border: #d3d8df;
    --border-soft: #e4e7ec;
    --accent: #cf5623;
    --accent-ink: #ffffff;
    --accent-soft: #fbeee8;
    --up: #b23b2e;
    --down: #2f6b47;
    --radius: 12px;
    --pad: 26px;
    --gap: 16px;
    --row-h: 40px;
    --font: 13.5px;
    --label: 10.5px;
    --value: 20px;
    --chart-h: 150px;
    --num-font: inherit;

    width: 100%;
    max-width: var(--stage-w);
    margin: 0 auto;
    height: 680px;
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    background: var(--bg-panel);
    color: var(--text);
    border: 1px solid rgba(0,0,0,.18);
    border-radius: calc(var(--radius) + 4px);
    overflow: hidden;
    font-size: var(--font);
    line-height: 1.5;
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 32px rgba(16,24,40,.08);
  }
  body[data-theme="dark"] .frame {
    --bg-page: #0b0d10;
    --bg-panel: #191c22;
    --bg-rail: #12151a;
    --bg-subtle: #20242c;
    --bg-hover: #262b34;
    --text: #f1f4f8;
    --muted: #b6bec9;
    --faint: #8f98a5;
    --border: #333a44;
    --border-soft: #2a3039;
    --accent: #ff8352;
    --accent-ink: #1a120e;
    --accent-soft: #2b1d16;
    --up: #ff8b7a;
    --down: #6fd39a;
    border-color: rgba(255,255,255,.14);
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  .variant[data-variant="B"] .frame {
    --radius: 6px;
    --pad: 16px;
    --gap: 9px;
    --row-h: 30px;
    --font: 12.5px;
    --label: 10px;
    --value: 17px;
    --chart-h: 112px;
    --num-font: "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  /* ---------- shell ---------- */
  .rail {
    background: var(--bg-rail);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 14px 0;
  }
  .rail i { width: 18px; height: 18px; border-radius: 5px; background: var(--border); display: block; }
  .rail i.on { background: var(--accent); }
  .rail .spacer { flex: 1; }

  .panel {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background: var(--bg-panel);
    container-type: inline-size;
  }

  .account {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: var(--pad) var(--pad) calc(var(--pad) * .55);
    border-bottom: 1px solid var(--border-soft);
  }
  .account h1 { font-size: calc(var(--font) + 3px); font-weight: 650; letter-spacing: -.01em; }
  .account .sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .account .actions { display: flex; gap: 6px; }

  button.ghost {
    border: 1px solid var(--border); background: var(--bg-panel); color: var(--text);
    border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  }
  button.ghost:hover { background: var(--bg-hover); }
  button.ghost.danger { color: var(--up); }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: var(--gap); padding: var(--gap) var(--pad);
  }
  .stat {
    border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 10px 13px; background: var(--bg-subtle); min-width: 0;
  }
  .stat .label { font-size: var(--label); letter-spacing: .04em; color: var(--muted); }
  .stat .value {
    font-size: var(--value); font-weight: 650; margin-top: 2px;
    font-variant-numeric: tabular-nums; font-family: var(--num-font);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat .delta { font-size: 11px; color: var(--muted); margin-left: 4px; }

  .variant[data-variant="B"] .stats {
    display: flex; gap: 0; padding: 0; margin: var(--gap) var(--pad) 0;
    border: 1px solid var(--border-soft); border-radius: var(--radius); background: var(--bg-subtle);
    overflow: hidden;
  }
  .variant[data-variant="B"] .stat {
    border: 0; border-right: 1px solid var(--border-soft); border-radius: 0;
    background: none; flex: 1 1 0; padding: 7px 10px;
  }
  .variant[data-variant="B"] .stat:last-child { border-right: 0; }

  .tabs {
    display: flex; gap: 2px; padding: 0 var(--pad);
    border-bottom: 1px solid var(--border-soft); margin-top: 2px;
  }
  .tab {
    border: 0; background: none; color: var(--muted); font-family: inherit;
    font-size: 12px; padding: 8px 10px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .variant[data-variant="B"] .tabs {
    border-bottom: 0; margin: var(--gap) var(--pad) 0; padding: 0; gap: 4px;
  }
  .variant[data-variant="B"] .tab {
    border: 1px solid var(--border-soft); border-radius: 4px;
    padding: 4px 10px; margin: 0; background: var(--bg-panel);
  }
  .variant[data-variant="B"] .tab.on {
    background: var(--accent-soft); border-color: var(--accent); color: var(--text);
  }

  .content {
    flex: 1; min-height: 0; overflow: auto;
    padding: var(--gap) var(--pad) var(--pad);
    display: flex; flex-direction: column; gap: var(--gap);
  }

  .trade-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) 330px;
    gap: var(--gap); align-items: start;
  }
  @container (max-width: 780px) {
    .trade-grid { grid-template-columns: minmax(0, 1fr); }
  }

  .card {
    border: 1px solid var(--border-soft); border-radius: var(--radius);
    background: var(--bg-panel); padding: 12px 13px; min-width: 0;
  }
  .variant[data-variant="B"] .card { padding: 9px 10px; }
  .card h2 {
    font-size: 11px; font-weight: 600; color: var(--muted);
    letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px;
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field span { font-size: 10px; color: var(--muted); }
  input, select {
    width: 100%; min-width: 0; padding: 6px 7px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-panel); color: var(--text); font-family: inherit;
  }
  input[type="number"] { font-variant-numeric: tabular-nums; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button {
    border: 0; background: none; color: var(--muted); padding: 5px 10px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .seg button.on {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  button.primary {
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    border-radius: 5px; padding: 6px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }

  .quote { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; font-variant-numeric: tabular-nums; }
  .quote .sym { font-weight: 650; }
  .quote .px { font-size: calc(var(--value) - 3px); font-weight: 650; font-family: var(--num-font); }
  .quote .muted { color: var(--muted); font-size: 11px; }

  .preview div { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  .preview .k { color: var(--muted); }
  .preview .v { font-variant-numeric: tabular-nums; font-family: var(--num-font); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 420px; }
  th {
    text-align: left; font-weight: 500; color: var(--muted);
    font-size: 10px; letter-spacing: .04em; padding: 6px 7px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  td {
    padding: 7px 7px; border-bottom: 1px solid var(--border-soft);
    height: var(--row-h); font-variant-numeric: tabular-nums; font-family: var(--num-font);
    white-space: nowrap;
  }
  td.name { font-family: inherit; color: var(--muted); }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px;
    background: var(--bg-subtle); border: 1px solid var(--border-soft); color: var(--muted);
    font-family: inherit;
  }

  .chart { width: 100%; height: var(--chart-h); display: block; }
  .measure {
    display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;
    font-size: 10.5px; color: var(--muted);
  }
  .measure b { color: var(--text); font-variant-numeric: tabular-nums; }

  footer {
    max-width: 1200px; margin: 18px auto 0; font-size: 12px; color: #4b5563; line-height: 1.7;
  }
  body[data-theme="dark"] footer { color: #aeb6c2; }
  footer b { color: inherit; }
</style>
</head>
<body data-variant="A" data-theme="light">

<div class="toolbar">
  <div class="brand">模拟盘 · UI 对比<small>结论：B 紧凑版落地；A 保留作对照。数据与功能相同</small></div>
  <div class="controls">
    <div class="control" data-control="variant">
      <button data-value="A" class="on">A 舒适</button>
      <button data-value="B">B 紧凑</button>
    </div>
    <div class="control" data-control="width">
      <button data-value="720">720</button>
      <button data-value="900">900</button>
      <button data-value="1080" class="on">1080</button>
    </div>
    <div class="control" data-control="theme">
      <button data-value="light" class="on">浅色</button>
      <button data-value="dark">深色</button>
    </div>
  </div>
</div>

<main>
  <section class="variant" data-variant="A"></section>
  <section class="variant" data-variant="B"></section>
</main>

<footer>
  评审结论：<b>B 紧凑版</b>。落地时颜色、圆角、字号改用宿主 token；此页只定密度与布局。
</footer>

<script>
const account = {
  initial: '100,000.00',
  equity: '100,013.99',
  cash: '89,993.99',
  pnl: '+13.99',
  today: '+13.99',
  date: '2026-10-21',
}
const positions = [
  { symbol: '600519.SH', name: '贵州茅台', qty: 100, available: 0, cost: '1331.88', last: '1332.00', pnl: '+12.00' },
  { symbol: '000001.SZ', name: '平安银行', qty: 1000, available: 1000, cost: '11.45', last: '11.50', pnl: '+50.00' },
]
const orders = [
  { time: '10:02', symbol: '600519.SH', side: '买', type: '限价', qty: 100, limit: '1300.00', status: '挂单' },
  { time: '09:41', symbol: '000001.SZ', side: '买', type: '市价', qty: 1000, limit: '—', status: '成交' },
]
const points = [100000, 100004, 100001, 100009, 100006, 100012, 100008, 100014, 100011, 100014]

function chartSvg() {
  const w = 600, h = 140, min = Math.min(...points), max = Math.max(...points)
  const span = max - min || 1
  const xy = points.map((v, i) => [
    (i / (points.length - 1)) * (w - 8) + 4,
    h - 10 - ((v - min) / span) * (h - 24),
  ])
  const line = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ')
  const area = `${line} L${w - 4},${h} L4,${h} Z`
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="权益曲线">
    <path d="${area}" fill="rgba(207,86,35,.10)"></path>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8"></path>
  </svg>`
}

function template() {
  return `
  <div class="frame">
    <div class="rail" aria-hidden="true">
      <i class="on"></i><i></i><i></i><span class="spacer"></span><i></i>
    </div>
    <div class="panel">
      <header class="account">
        <div>
          <h1>模拟盘</h1>
          <div class="sub">${account.date} · 初始 ${account.initial} · 运行中</div>
        </div>
        <div class="actions">
          <button class="ghost">刷新</button>
          <button class="ghost danger">重置</button>
        </div>
      </header>

      <div class="stats">
        <div class="stat"><div class="label">总资产</div><div class="value">${account.equity}</div></div>
        <div class="stat"><div class="label">可用现金</div><div class="value">${account.cash}</div></div>
        <div class="stat"><div class="label">累计盈亏</div><div class="value up">${account.pnl}</div></div>
        <div class="stat"><div class="label">今日盈亏</div><div class="value up">${account.today}</div></div>
      </div>

      <nav class="tabs">
        <button class="tab on">交易</button>
        <button class="tab">持仓 2</button>
        <button class="tab">订单 1</button>
        <button class="tab">复盘</button>
      </nav>

      <div class="content">
        <div class="trade-grid">
          <div class="card">
            <h2>下单</h2>
            <div class="row" style="margin-bottom:10px">
              <label class="field" style="width:110px"><span>代码</span><input value="000001.SZ"></label>
              <div class="seg"><button class="on">买入</button><button>卖出</button></div>
              <div class="seg"><button class="on">市价</button><button>限价</button></div>
              <label class="field" style="width:92px"><span>数量</span><input type="number" value="1000"></label>
              <button class="ghost">查行情</button>
            </div>
            <div class="quote" style="margin-bottom:10px">
              <span class="sym">000001.SZ 平安银行</span>
              <span class="px">11.50</span>
              <span class="muted">买一 11.49</span>
              <span class="muted">卖一 11.51</span>
            </div>
            <div class="row">
              <button class="ghost">预览</button>
              <button class="primary">买入</button>
            </div>
          </div>

          <div class="card">
            <h2>预览</h2>
            <div class="preview">
              <div><span class="k">价格</span><span class="v">11.51</span></div>
              <div><span class="k">金额</span><span class="v">11,510.00</span></div>
              <div><span class="k">佣金</span><span class="v">5.00</span></div>
              <div><span class="k">印花税</span><span class="v">0.00</span></div>
              <div><span class="k">过户费</span><span class="v">0.12</span></div>
              <div><span class="k">成交后现金</span><span class="v">78,484.88</span></div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>持仓</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>代码</th><th>名称</th><th>数量</th><th>可卖</th><th>成本</th><th>现价</th><th>浮盈亏</th></tr></thead>
              <tbody>
                ${positions.map(p => `<tr>
                  <td>${p.symbol}</td><td class="name">${p.name}</td>
                  <td>${p.qty}</td><td>${p.available}</td>
                  <td>${p.cost}</td><td>${p.last}</td>
                  <td class="${p.pnl.startsWith('+') ? 'up' : 'down'}">${p.pnl}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="trade-grid">
          <div class="card">
            <h2>最近订单</h2>
            <div class="table-wrap">
              <table>
                <thead><tr><th>时间</th><th>代码</th><th>方向</th><th>类型</th><th>数量</th><th>状态</th></tr></thead>
                <tbody>
                  ${orders.map(o => `<tr>
                    <td>${o.time}</td><td>${o.symbol}</td><td>${o.side}</td>
                    <td>${o.type}</td><td>${o.qty}</td><td><span class="tag">${o.status}</span></td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
          <div class="card">
            <h2>权益曲线</h2>
            ${chartSvg()}
            <div class="measure" data-measure></div>
          </div>
        </div>
      </div>
    </div>
  </div>`
}

function renderAll() {
  document.querySelectorAll('.variant').forEach(section => {
    section.innerHTML = template()
  })
  measure()
}

function parseHex(hex) {
  const value = hex.trim().replace('#', '')
  const full = value.length === 3 ? value.split('').map(c => c + c).join('') : value
  return [0, 2, 4].map(i => parseInt(full.slice(i, i + 2), 16))
}
function luminance(rgb) {
  const [r, g, b] = rgb.map(v => {
    const s = v / 255
    return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4
  })
  return 0.2126 * r + 0.7152 * g + 0.0722 * b
}
function ratio(a, b) {
  const l1 = luminance(parseHex(a)), l2 = luminance(parseHex(b))
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05)
}
function measure() {
  document.querySelectorAll('.variant').forEach(section => {
    const frame = section.querySelector('.frame')
    const style = getComputedStyle(frame)
    const text = style.getPropertyValue('--text')
    const muted = style.getPropertyValue('--muted')
    const bg = style.getPropertyValue('--bg-panel')
    const box = section.querySelector('[data-measure]')
    if (box) box.innerHTML = `正文 <b>${ratio(text, bg).toFixed(1)}:1</b> · 次要 <b>${ratio(muted, bg).toFixed(1)}:1</b>`
  })
}

document.querySelectorAll('[data-control]').forEach(group => {
  group.addEventListener('click', event => {
    const button = event.target.closest('button')
    if (!button) return
    const value = button.dataset.value
    const kind = group.dataset.control
    if (kind === 'variant') document.body.dataset.variant = value
    if (kind === 'theme') {
      document.body.dataset.theme = value
      document.documentElement.dataset.theme = value
    }
    if (kind === 'width') document.documentElement.style.setProperty('--stage-w', `${value}px`)
    group.querySelectorAll('button').forEach(item => item.classList.toggle('on', item === button))
    if (kind === 'theme') measure()
  })
})

renderAll()
</script>
</body>
</html>
